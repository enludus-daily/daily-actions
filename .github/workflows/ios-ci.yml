# 再利用ワークフロー: 検査 → ビルド → テスト → スクリーンショット。署名はしない。
# 呼び出し: uses: enludus-daily/daily-actions/.github/workflows/ios-ci.yml@<40桁の SHA>
#   with: actions-sha: <同じ SHA>（中の部品 guard / scan / setup-ios もこの版で使うため）
name: iOS CI (reusable)

on:
  workflow_call:
    inputs:
      actions-sha:
        description: 呼び出しの @ に書いたのと同じ daily-actions の 40 桁の SHA（部品をこの版で使う）
        type: string
        required: true
      scheme:
        description: ビルド・テストするスキーム
        type: string
        required: true
      xcode-version:
        description: Xcode の版（ランナーの /Applications/Xcode_<version>.app）
        type: string
        default: "26.6"
      runs-on:
        description: macOS ランナー（標準ランナーだけが public リポジトリで無料。-large / -xlarge は有料）
        type: string
        default: macos-26
      test-destination:
        type: string
        default: "platform=iOS Simulator,name=iPhone 17,OS=latest"
      extra-test-destination:
        description: |
          テストをもう 1 台でも走らせる（例 iPhone Duo と普通の iPhone の両方）。空なら test-destination だけ。
          UI テストの添付の画像（1 操作ごとの撮影）は artifact flow-screenshots に置く
        type: string
        default: ""
      screenshot-device:
        description: スクリーンショットを撮るシミュレータ（6.9 インチ = App Store の必須サイズ）
        type: string
        default: iPhone 17 Pro Max
      screenshot-scenes:
        description: |
          撮る画面（空白区切り）。各画面は起動引数 -screenshotScene <名前> でアプリに渡す（アプリが UserDefaults の
          screenshotScene を読んでその画面を開く）。名前に @dark を付けるとダークモードで撮る。launch は引数なしの起動。
        type: string
        default: launch
      screenshot-posture:
        description: 使えない（Xcode 27.1 のシミュレータに開け閉めの操作がない。2026-11-11 確認）。互換のために残し、値があれば警告だけ出す
        type: string
        default: ""
      demo-video:
        description: |
          デモの録画（YouTube の「AI が毎日アプリを作る」シリーズ用。2026-11-10 本人の許可で追加）。
          en / ja で、その言語のアプリを起動引数 -demo で開き、screenshot-device で録画して artifact demo-video に置く。空なら録らない
        type: string
        default: ""
      demo-seconds:
        description: 録画の長さ（秒）。アプリの -demo は 15〜20 秒で主な流れを再生する
        type: number
        default: 22
      max-runs-per-day:
        type: number
        default: 40
      max-consecutive-failures:
        type: number
        default: 3
      guard-disabled:
        description: 呼び出し元で vars.DAILY_GUARD_DISABLED を渡す（本人だけが設定する）
        type: string
        default: "false"

permissions:
  contents: read
  actions: read

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate actions-sha
        env:
          ACTIONS_SHA: ${{ inputs.actions-sha }}
        run: |
          if ! [[ "$ACTIONS_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::actions-sha は 40 桁のコミット SHA にしてください（呼び出しの @ と同じ値）"; exit 1
          fi
      - name: Checkout daily-actions (pinned)
        uses: actions/checkout@v5
        with:
          repository: enludus-daily/daily-actions
          ref: ${{ inputs.actions-sha }}
          path: .daily-actions
          persist-credentials: false
      - uses: ./.daily-actions/guard
        with:
          max-per-day: ${{ inputs.max-runs-per-day }}
          max-consecutive-failures: ${{ inputs.max-consecutive-failures }}
          disabled: ${{ inputs.guard-disabled }}

  scan:
    needs: [guard]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout daily-actions (pinned)
        uses: actions/checkout@v5
        with:
          repository: enludus-daily/daily-actions
          ref: ${{ inputs.actions-sha }}
          path: .daily-actions
          persist-credentials: false
      - uses: ./.daily-actions/scan

  build-test:
    needs: [guard, scan]
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Checkout daily-actions (pinned)
        uses: actions/checkout@v5
        with:
          repository: enludus-daily/daily-actions
          ref: ${{ inputs.actions-sha }}
          path: .daily-actions
          persist-credentials: false
      - uses: ./.daily-actions/setup-ios
        with:
          xcode-version: ${{ inputs.xcode-version }}
      - name: Build and test
        env:
          SCHEME: ${{ inputs.scheme }}
          DESTINATION: ${{ inputs.test-destination }}
          EXTRA_DESTINATION: ${{ inputs.extra-test-destination }}
        run: |
          set -o pipefail
          dest=(-destination "$DESTINATION")
          # 2 台目は順に走らせる（同時に走らせると、シミュレータの接続切れで UI テストが落ちることがある。2026-11-11）
          [ -n "$EXTRA_DESTINATION" ] && dest+=(-destination "$EXTRA_DESTINATION" -disable-concurrent-destination-testing)
          xcodebuild test \
            -scheme "$SCHEME" \
            "${dest[@]}" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
      - name: Export UI test screenshots
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          res="$RUNNER_TEMP/TestResults.xcresult"; raw="$RUNNER_TEMP/flow-raw"; out="$RUNNER_TEMP/flow-screenshots"
          [ -d "$res" ] || { echo "テストの結果がありません"; exit 0; }
          mkdir -p "$raw" "$out"
          xcrun xcresulttool export attachments --path "$res" --output-path "$raw" || exit 0
          # manifest.json の名前（<端末>-<番号>-<操作>-screen<n>）に付け替える。失敗したテストの添付も残す
          jq -r '.[] | .attachments[]? | [.exportedFileName, .suggestedHumanReadableName] | @tsv' "$raw/manifest.json" 2>/dev/null |
            while IFS=$'\t' read -r file name; do
              case "$file" in *.png|*.jpg|*.jpeg|*.heic) ;; *) continue ;; esac
              # 書き出しが付ける "_<番号>_<UUID>" と拡張子を外す
              base=$(printf '%s' "$name" | sed -E 's/\.(png|jpe?g|heic)$//; s/_[0-9]+_[0-9A-Fa-f-]{36}$//')
              safe=$(printf '%s' "$base" | tr -c 'A-Za-z0-9._-' '_' | cut -c1-120)
              cp "$raw/$file" "$out/$safe.${file##*.}"
            done
          ls -l "$out" | head -80
          echo "--- テストの結果の要約"
          xcrun xcresulttool get test-results summary --path "$res" --compact 2>/dev/null | jq -r '.testFailures[]? | "\(.targetName) / \(.testName): \(.failureText)"' | head -40 || true
      - name: Upload UI test screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: flow-screenshots
          path: ${{ runner.temp }}/flow-screenshots
          if-no-files-found: ignore
          retention-days: 14
      - name: Screenshot (best effort)
        continue-on-error: true
        env:
          SCHEME: ${{ inputs.scheme }}
          DEVICE: ${{ inputs.screenshot-device }}
          SCENES: ${{ inputs.screenshot-scenes }}
          POSTURE: ${{ inputs.screenshot-posture }}
        run: |
          set -euo pipefail
          xcodebuild build -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=$DEVICE,OS=latest" \
            -derivedDataPath "$RUNNER_TEMP/dd-shot" CODE_SIGNING_ALLOWED=NO -quiet
          app=$(find "$RUNNER_TEMP/dd-shot/Build/Products" -maxdepth 2 -name '*.app' -path '*iphonesimulator*' | head -1)
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          udid=$(xcrun simctl list devices available -j | jq -r --arg n "$DEVICE" '[.devices[][] | select(.name == $n)][-1].udid')
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl status_bar "$udid" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$udid" "$app"
          if [ -n "${POSTURE:-}" ]; then
            # Xcode 27.1 の simctl・XCTest・Simulator には開け閉め（姿勢）の操作がない（2026-11-11 に CI で確認）。入力は互換のために残す
            echo "::warning::screenshot-posture は使えません（シミュレータを開いた状態にする操作がない）。$POSTURE は無視します"
          fi
          out="$RUNNER_TEMP/screenshots"
          mkdir -p "$out"
          # iPhone Duo のように画面が複数ある端末では、--display を付けないと撮れない。
          # その場合は、エラーに並ぶ画面（例: "--display=3  LCD-1 (primary-1) 2007x2853"）を全部撮る。
          # iPhone Duo のシミュレータは閉じた状態で起動し、内側の画面（LCD-1、display3）は何も描かれない（全画素が黒）。
          # 開いた状態にする操作が simctl・XCTest・Simulator に無い（2026-11-11 確認）ので、まっ黒な画面は残さず知らせる。
          is_black() {  # BMP の画素を間引いて調べ、RGB がすべて 0 なら 0 を返す
            python3 -I - "$1" <<'PY'
          import sys
          d = open(sys.argv[1], 'rb').read()
          off = int.from_bytes(d[10:14], 'little'); step = int.from_bytes(d[28:30], 'little') // 8
          px = memoryview(d)[off:]
          sys.exit(0 if all(px[i] == 0 and px[i + 1] == 0 and px[i + 2] == 0 for i in range(0, len(px) - step + 1, step * 97)) else 1)
          PY
          }
          dark_displays=""
          shoot() {
            local name="$1" err displays id size f
            if ! err=$(xcrun simctl io "$udid" screenshot "$out/$name.png" 2>&1); then
              displays=$(printf '%s\n' "$err" | sed -nE 's/^[[:space:]]*--display=([0-9]+)[[:space:]]+.*[[:space:]]([0-9]+x[0-9]+)$/\1 \2/p')
              if [ -z "$displays" ]; then printf '%s\n' "$err"; return 1; fi
              while read -r id size; do
                f="$out/$name-display${id}-${size}.png"
                xcrun simctl io "$udid" screenshot --display="$id" "$f"
                if xcrun simctl io "$udid" screenshot --type=bmp --display="$id" "$RUNNER_TEMP/probe.bmp" >/dev/null 2>&1 &&
                   is_black "$RUNNER_TEMP/probe.bmp"; then
                  rm -f "$f"; case " $dark_displays " in *" $id "*) ;; *) dark_displays="$dark_displays $id" ;; esac
                fi
              done <<< "$displays"
              rm -f "$RUNNER_TEMP/probe.bmp"
            fi
          }
          n=0
          for scene in $SCENES; do
            n=$((n + 1))
            case "$scene" in *[!A-Za-z0-9@_-]*) echo "::warning::画面の名前に使えない文字: $scene"; continue ;; esac
            # 名前の後ろの @dark でダークモード、@en で英語（-AppleLanguages (en) -AppleLocale en_US）。両方つけてよい（例: shop@en@dark）
            name="$scene"; dark=0; lang=()
            while [[ "$name" == *@* ]]; do
              suffix="${name##*@}"; name="${name%@*}"
              case "$suffix" in
                dark) dark=1 ;;
                en) lang=(-AppleLanguages "(en)" -AppleLocale en_US) ;;
                *) echo "::warning::知らない印: @$suffix" ;;
              esac
            done
            if [ "$dark" = 1 ]; then xcrun simctl ui "$udid" appearance dark || true; else xcrun simctl ui "$udid" appearance light || true; fi
            xcrun simctl terminate "$udid" "$bundle_id" 2>/dev/null || true
            if [ "$name" = launch ]; then
              xcrun simctl launch "$udid" "$bundle_id" ${lang[@]+"${lang[@]}"}
            else
              xcrun simctl launch "$udid" "$bundle_id" -screenshotScene "$name" ${lang[@]+"${lang[@]}"}
            fi
            sleep 8
            shoot "$(printf '%02d' "$n")-${scene/@/-}" || echo "::warning::$scene を撮れませんでした"
          done
          if [ -n "$dark_displays" ]; then
            msg="画面$dark_displays はまっ黒だったので残していません。iPhone Duo の内側の画面（display3）は、CI のシミュレータでは閉じた状態のため描かれません。内側の並べ方は size class（regular）で作り、Simulator.app か実機で確かめてください。"
            echo "::notice::$msg"; printf '%s\n' "$msg" > "$out/README-dark-displays.txt"
          fi
          ls -l "$out"
      - name: Demo video (best effort)
        if: inputs.demo-video != ''
        continue-on-error: true
        timeout-minutes: 5
        env:
          SCHEME: ${{ inputs.scheme }}
          DEVICE: ${{ inputs.screenshot-device }}
          DEMO_LANG: ${{ inputs.demo-video }}
          DEMO_SECONDS: ${{ inputs.demo-seconds }}
        run: |
          set -euo pipefail
          case "$DEMO_LANG" in en) lang=(-AppleLanguages "(en)" -AppleLocale en_US) ;; ja) lang=(-AppleLanguages "(ja)" -AppleLocale ja_JP) ;; *) echo "::warning::demo-video は en か ja: $DEMO_LANG"; exit 0 ;; esac
          # 前の手順（Screenshot）でビルド・インストール済み。無ければここで作る
          app=$(find "$RUNNER_TEMP/dd-shot/Build/Products" -maxdepth 2 -name '*.app' -path '*iphonesimulator*' 2>/dev/null | head -1 || true)
          if [ -z "$app" ]; then
            xcodebuild build -scheme "$SCHEME" -destination "platform=iOS Simulator,name=$DEVICE,OS=latest" \
              -derivedDataPath "$RUNNER_TEMP/dd-shot" CODE_SIGNING_ALLOWED=NO -quiet
            app=$(find "$RUNNER_TEMP/dd-shot/Build/Products" -maxdepth 2 -name '*.app' -path '*iphonesimulator*' | head -1)
          fi
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          udid=$(xcrun simctl list devices available -j | jq -r --arg n "$DEVICE" '[.devices[][] | select(.name == $n)][-1].udid')
          xcrun simctl boot "$udid" 2>/dev/null || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl status_bar "$udid" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$udid" "$app"
          xcrun simctl ui "$udid" appearance light || true
          xcrun simctl terminate "$udid" "$bundle_id" 2>/dev/null || true
          out="$RUNNER_TEMP/demo"
          mkdir -p "$out"
          # 画面が複数ある端末（iPhone Duo）は --display が要る。閉じた姿勢では「primary」の内側の画面は真っ白で、
          # アプリは外側の画面に出る（2026-11-11 のタマヘビの CI で確認）。アプリを開いてから各画面を撮り、
          # いちばん中身の多い（PNG が大きい）画面を録る
          xcrun simctl launch "$udid" "$bundle_id" ${lang[@]+"${lang[@]}"}
          sleep 6
          display=()
          if ! err=$(xcrun simctl io "$udid" screenshot "$out/probe.png" 2>&1); then
            best=""; bestsize=0
            for id in $(printf '%s\n' "$err" | sed -nE 's/^[[:space:]]*--display=([0-9]+)[[:space:]].*/\1/p'); do
              xcrun simctl io "$udid" screenshot --display="$id" "$out/probe-$id.png" >/dev/null 2>&1 || continue
              size=$(stat -f %z "$out/probe-$id.png")
              echo "display $id: $size bytes"
              if [ "$size" -gt "$bestsize" ]; then best=$id; bestsize=$size; fi
            done
            [ -n "$best" ] && display=(--display="$best") && echo "recording display $best"
          fi
          rm -f "$out"/probe*.png
          xcrun simctl terminate "$udid" "$bundle_id" 2>/dev/null || true
          sleep 1
          xcrun simctl io "$udid" recordVideo --codec=h264 --force ${display[@]+"${display[@]}"} "$out/demo-$DEMO_LANG.mp4" &
          rec=$!
          sleep 2
          xcrun simctl launch "$udid" "$bundle_id" -demo ${lang[@]+"${lang[@]}"}
          sleep "$DEMO_SECONDS"
          kill -INT "$rec"
          wait "$rec" || true
          ls -l "$out"
          size=$(stat -f %z "$out/demo-$DEMO_LANG.mp4" 2>/dev/null || echo 0)
          # 1 秒でも映っていれば 100KB を超える。小さいのは真っ白な画面を録ったとき
          [ "$size" -gt 100000 ] || echo "::warning::デモを録画できませんでした（$size bytes）"
      - name: Upload demo video
        if: always() && inputs.demo-video != ''
        uses: actions/upload-artifact@v5
        with:
          name: demo-video
          path: ${{ runner.temp }}/demo
          if-no-files-found: warn
          retention-days: 30
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: warn
          retention-days: 14
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: TestResults.xcresult
          path: ${{ runner.temp }}/TestResults.xcresult
          retention-days: 7
