# 診断（一時的。main には入れない）：テンプレートに UI テストの差分（diag/template.patch）を当て、
# iPhone Duo と普通の iPhone の両方でテストし、ios-ci.yml と同じ手順で 1 操作ごとの画像を取り出す。
name: diag-flow
on:
  push:
    branches: ['diag/flow']
permissions:
  contents: read
jobs:
  flow:
    runs-on: xcode-27
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          repository: enludus-daily/daily-app-template
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          path: .daily-actions
          persist-credentials: false
      - name: Apply template patch
        run: git apply --whitespace=nowarn .daily-actions/diag/template.patch && git status --short
      - uses: ./.daily-actions/setup-ios
        with:
          xcode-version: "27.1"
      - name: Simulators
        run: xcrun simctl list devices available | grep -E 'iPhone|-- iOS' | head -30
      - name: Build and test（ios-ci.yml と同じ）
        env:
          DESTINATION: "platform=iOS Simulator,name=iPhone Duo,OS=27.1"
          EXTRA_DESTINATION: "platform=iOS Simulator,name=iPhone 17,OS=27.1"
        run: |
          set -o pipefail
          dest=(-destination "$DESTINATION")
          [ -n "$EXTRA_DESTINATION" ] && dest+=(-destination "$EXTRA_DESTINATION")
          xcodebuild test -scheme DailyApp "${dest[@]}" \
            -derivedDataPath "$RUNNER_TEMP/dd" -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions
      - name: Export UI test screenshots（ios-ci.yml と同じ）
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          res="$RUNNER_TEMP/TestResults.xcresult"; raw="$RUNNER_TEMP/flow-raw"; out="$RUNNER_TEMP/flow-screenshots"
          [ -d "$res" ] || { echo "テストの結果がありません"; exit 0; }
          mkdir -p "$raw" "$out"
          xcrun xcresulttool export attachments --path "$res" --output-path "$raw" || exit 0
          head -c 3000 "$raw/manifest.json"; echo
          jq -r '.[] | .attachments[]? | [.exportedFileName, .suggestedHumanReadableName] | @tsv' "$raw/manifest.json" 2>/dev/null |
            while IFS=$'\t' read -r file name; do
              case "$file" in *.png|*.jpg|*.jpeg|*.heic) ;; *) continue ;; esac
              safe=$(printf '%s' "${name%.*}" | tr -c 'A-Za-z0-9._-' '_' | cut -c1-120)
              cp "$raw/$file" "$out/$safe.${file##*.}"
            done
          ls -l "$out" | head -80
      - name: 検出の確認：主なボタンを画面の下に押し出すと、テストが失敗すること
        if: always()
        run: |
          set -o pipefail
          sed -i '' 's/        .padding()$/        .padding(.top, 2400)/' App/Sources/ContentView.swift
          grep -n 'padding(.top, 2400)' App/Sources/ContentView.swift
          if xcodebuild test -scheme DailyApp -destination "platform=iOS Simulator,name=iPhone 17,OS=27.1" \
               -only-testing:DailyAppUITests/MainFlowUITests/testMainButtonsAreOnScreenAndHittable \
               -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/neg.log" | xcbeautify --renderer github-actions; then
            echo "::error::切れたボタンを見つけられませんでした"; exit 1
          fi
          grep -E 'はみ出し|押せません' "$RUNNER_TEMP/neg.log" | head -5
          echo "期待どおり失敗した"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: flow-screenshots
          path: ${{ runner.temp }}/flow-screenshots
          retention-days: 3
