# 診断（一時的。main には入れない）：テンプレートに UI テストの差分（diag/template.patch）を当て、
# このブランチの ios-ci.yml の build-test の手順（テスト・UI テストの画像の取り出し・撮影・録画）をそのまま実行する。
name: diag-flow
on:
  push:
    branches: ['diag/flow', 'diag/flow-*']
permissions:
  contents: read
jobs:
  flow:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      SCHEME: DailyApp
      DESTINATION: "platform=iOS Simulator,name=iPhone Duo,OS=27.1"
      EXTRA_DESTINATION: "platform=iOS Simulator,name=iPhone 17,OS=latest"
      DEVICE: iPhone Duo
      SCENES: launch launch@en
      POSTURE: ""
      DEMO_LANG: en
      DEMO_SECONDS: "22"
    steps:
      - uses: actions/checkout@v5
        with:
          repository: enludus-daily/daily-app-template
          ref: d11eec9df5bdd2be297875a657099cab45ab49d6
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          path: .daily-actions
          persist-credentials: false
      - name: Apply template patch
        run: git apply --whitespace=nowarn .daily-actions/diag/template.patch && git status --short
      - uses: ./.daily-actions/setup-ios
        with:
          xcode-version: "27.1"
      - name: Extract steps from ios-ci.yml
        run: |
          for step in "Build and test" "Export UI test screenshots" "Screenshot (best effort)" "Demo video (best effort)"; do
            f="$RUNNER_TEMP/$(echo "$step" | tr -c 'A-Za-z' '_').sh"
            ruby -ryaml -e 'puts YAML.load_file(ARGV[0])["jobs"]["build-test"]["steps"].find { |s| s["name"] == ARGV[1] }["run"]' \
              .daily-actions/.github/workflows/ios-ci.yml "$step" > "$f"
            echo "== $step → $f ($(wc -l < "$f") 行)"
          done
      - name: Build and test
        run: bash -e -o pipefail "$RUNNER_TEMP/Build_and_test_.sh"
      - name: Export UI test screenshots
        if: always()
        continue-on-error: true
        run: bash -e "$RUNNER_TEMP/Export_UI_test_screenshots_.sh"
      - name: Screenshot (best effort)
        if: always()
        continue-on-error: true
        run: bash -e "$RUNNER_TEMP/Screenshot__best_effort__.sh"
      - name: Demo video (best effort)
        if: always()
        continue-on-error: true
        run: bash -e "$RUNNER_TEMP/Demo_video__best_effort__.sh"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: diag-out
          path: |
            ${{ runner.temp }}/flow-screenshots
            ${{ runner.temp }}/screenshots
            ${{ runner.temp }}/demo
          retention-days: 3
