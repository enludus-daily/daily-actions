# 診断（一時的。main には入れない）：iPhone Duo の内側の画面（display3）がまっ黒になる原因を調べる。
# テンプレートのアプリ（公開リポジトリを読むだけ）を入れ、いくつかのやり方で全部の画面を撮る。
name: diag-duo
on:
  push:
    branches: ['diag/**']
permissions:
  contents: read
jobs:
  duo:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          repository: enludus-daily/daily-app-template
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          path: .daily-actions
          persist-credentials: false
      - uses: ./.daily-actions/setup-ios
        with:
          xcode-version: "27.1"
      - name: Diagnose
        continue-on-error: true
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/diag"; mkdir -p "$out"
          xcodebuild build -scheme DailyApp -destination "platform=iOS Simulator,name=iPhone Duo,OS=27.1" \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO -quiet
          app=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name '*.app' -path '*iphonesimulator*' | head -1)
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          udid=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name == "iPhone Duo")][-1].udid')
          echo "udid=$udid bundle=$bundle_id"
          echo "--- devicetypes"; xcrun simctl list devicetypes | grep -i -E 'duo|fold' || true
          echo "--- help ui"; xcrun simctl help ui 2>&1 || true
          echo "--- help io"; xcrun simctl help io 2>&1 || true
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          echo "--- enumerate (booted)"; xcrun simctl io "$udid" enumerate 2>&1 || true
          xcrun simctl install "$udid" "$app"
          shoot() {
            local tag="$1" err ids
            err=$(xcrun simctl io "$udid" screenshot "$out/$tag.png" 2>&1) && return 0
            echo "$err" | sed -n '1,20p'
            ids=$(printf '%s\n' "$err" | sed -nE 's/^[[:space:]]*--display=([0-9]+).*/\1/p')
            for id in $ids; do xcrun simctl io "$udid" screenshot --display="$id" "$out/$tag-display$id.png" 2>&1 | tail -1; done
          }
          xcrun simctl launch "$udid" "$bundle_id"; sleep 10
          echo "=== A: headless, no posture"; shoot A-headless
          two() { local tag="$1"; for id in 1 3; do xcrun simctl io "$udid" screenshot --display="$id" "$out/$tag-display$id.png" 2>&1 | tail -1; done; }
          echo "=== B: mask ignored"; xcrun simctl io "$udid" screenshot --display=3 --mask=ignored "$out/B-mask-ignored-display3.png" 2>&1 | tail -1
          echo "=== C: display 3 power on (explicit)"; xcrun simctl io "$udid" screenConfig --display=3 power on 2>&1; sleep 5; two C-d3-on
          echo "=== D: display 1 power off（開いた状態のつもり）"; xcrun simctl io "$udid" screenConfig --display=1 power off 2>&1; sleep 8; two D-d1-off
          xcrun simctl terminate "$udid" "$bundle_id" 2>/dev/null || true
          xcrun simctl launch "$udid" "$bundle_id"; sleep 10; two D2-d1-off-relaunch
          echo "--- enumerate (d1 off)"; xcrun simctl io "$udid" enumerate 2>&1 | grep -E 'Power state|Default width|Screen ID|Device Name' || true
          echo "=== E: display 3 off → on（入れ直し）"; xcrun simctl io "$udid" screenConfig --display=3 power off 2>&1; sleep 3
          xcrun simctl io "$udid" screenConfig --display=3 power on 2>&1; sleep 8; two E-d3-cycle
          echo "=== F: display 1 power on again（閉じた状態に戻す）"; xcrun simctl io "$udid" screenConfig --display=1 power on 2>&1; sleep 8; two F-d1-on
          echo "=== G: 起動前に display 1 を off にして boot しなおす"
          xcrun simctl shutdown "$udid"; xcrun simctl boot "$udid"; xcrun simctl bootstatus "$udid" -b >/dev/null
          xcrun simctl io "$udid" screenConfig --display=1 power off 2>&1; sleep 10
          xcrun simctl launch "$udid" "$bundle_id"; sleep 10; two G-reboot-d1-off
          ls -l "$out"; shasum "$out"/*.png || true
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: diag-duo
          path: ${{ runner.temp }}/diag
          retention-days: 3
