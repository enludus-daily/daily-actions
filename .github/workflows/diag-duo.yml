# 診断（一時的。main には入れない）：iPhone Duo の内側の画面（display3）がまっ黒になる原因を調べる。
# テンプレートのアプリ（公開リポジトリを読むだけ）を入れ、いくつかのやり方で全部の画面を撮る。
name: diag-duo
on:
  push:
    branches: ['diag/**']
permissions:
  contents: read
jobs:
  duo:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          repository: enludus-daily/daily-app-template
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          path: .daily-actions
          persist-credentials: false
      - uses: ./.daily-actions/setup-ios
        with:
          xcode-version: "27.1"
      - name: Diagnose
        continue-on-error: true
        run: |
          set +e -uo pipefail
          out="$RUNNER_TEMP/diag"; mkdir -p "$out"
          echo "--- simctl help（全部の操作）"; xcrun simctl help 2>&1 | sed -n '1,80p'
          plat=$(xcrun --sdk iphonesimulator --show-sdk-platform-path)
          echo "--- XCTest / XCUIAutomation の見出しで fold・posture・hinge・display を探す"
          find "$plat/Developer/Library/Frameworks" "$plat/Developer/Library/PrivateFrameworks" -name '*.h' -o -name '*.swiftinterface' 2>/dev/null |
            xargs grep -n -i -E 'fold|posture|hinge|XCUIScreen|screens' 2>/dev/null | grep -v -i 'scaffold\|manifold\|threshold' | head -80
          echo "--- Simulator.app の文字列"
          sim="$(xcode-select -p)/Applications/Simulator.app/Contents"
          grep -r -a -o -h -i -E '[A-Za-z ]{0,30}(fold|posture|hinge)[A-Za-z ]{0,30}' "$sim/Resources" "$sim/MacOS" 2>/dev/null | sort -u | head -60
          echo "--- CoreSimulator の文字列"
          for f in /Library/Developer/PrivateFrameworks/CoreSimulator.framework/Versions/A/CoreSimulator "$(xcode-select -p)/usr/bin/simctl"; do
            [ -f "$f" ] && strings -a "$f" | grep -i -E 'fold|posture|hinge' | sort -u | head -40
          done
          echo "--- デバイスの型（iPhone Duo）"
          dt=$(find /Library/Developer/CoreSimulator/Profiles "$(xcode-select -p)/Platforms" -name 'iPhone Duo.simdevicetype' 2>/dev/null | head -1); echo "$dt"
          [ -n "$dt" ] && find "$dt" -name '*.plist' | while read -r f; do echo "== $f"; plutil -p "$f" | head -120; done
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: diag-duo
          path: ${{ runner.temp }}/diag
          retention-days: 3
